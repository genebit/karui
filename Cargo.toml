[workspace]
members = [
  "crates/karui-core",
  "crates/karui-cli",
]
# The engine needs no webview, so plain `cargo test` stays fast and works on a
# machine without GTK or WebKit installed.
default-members = [
  "crates/karui-core",
  "crates/karui-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/genebit/karui"
rust-version = "1.82"

[workspace.dependencies]
karui-core = { path = "crates/karui-core" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
