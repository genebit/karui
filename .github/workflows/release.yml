name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # The draft release is made once, before any bundle finishes. Left to
  # tauri-action, each of the three jobs looked for it on finishing and made
  # it if missing, so two finishing together could leave duplicate drafts.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            // A re-run finds the draft its first attempt made.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) return existing.id;
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `karui ${tag}`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  bundle:
    needs: create-release
    # Also runs when create-release is skipped, for a workflow_dispatch build.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: bundling against an older glibc keeps the
          # AppImage and .deb usable on older distributions.
          - platform: ubuntu-22.04
            args: ''
          # aarch64 rather than universal-apple-darwin: a universal build is
          # `lipo` over two compiles, twice the wall clock for an Intel slice.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Uploads into the draft create-release made. Empty for a
          # workflow_dispatch build, which then builds and publishes nothing.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # So a dry run still leaves something to install and check by hand.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/aarch64-apple-darwin/release/bundle/**/*.dmg
            target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz
          if-no-files-found: error
